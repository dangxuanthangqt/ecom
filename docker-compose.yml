services:
  # Database
  #
  # POSTGRES_DB below is the ONLY place the database name is written. The
  # healthcheck reads it back from the container environment ($$POSTGRES_DB —
  # the doubled $ escapes compose's own substitution), so the two can never
  # drift apart the way they did when both were hardcoded.
  #
  # POSTGRES_DB/USER/PASSWORD are honoured ONLY while the `postgres_data`
  # volume is empty. Once initialised, the entrypoint logs "Skipping
  # initialization" and ignores them — renaming the database here does NOT
  # create it. See docs/postgres-database-management.md § 4.
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # `pg_isready -d <name>` does NOT verify the database exists — it only asks
    # whether the server accepts connections, so it reports healthy against a
    # database that was never created. This runs a real query instead, which is
    # what `migrate`/`app` actually need to be true before they start.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'psql -U postgres -d "$$POSTGRES_DB" -c ''SELECT 1'' >/dev/null || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecom-network

  # Caches the auth guard's role/permission lookup (RolePermissionCacheService).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecom-network

  # One-shot migration job. Runs `prisma migrate deploy` exactly once, before the
  # app starts. Never scale this service.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    # Same file a `NODE_ENV=production` boot reads outside Docker (see
    # src/constants/env-file.constant.ts); compose injects it as real container
    # environment variables, which take precedence over any file in the image.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecom-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    # Same file a `NODE_ENV=production` boot reads outside Docker (see
    # src/constants/env-file.constant.ts); compose injects it as real container
    # environment variables, which take precedence over any file in the image.
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ecom-network

volumes:
  postgres_data:
  redis_data:

networks:
  ecom-network:
    driver: bridge
