info:
  title: Ecom API
  description: The Ecom API description
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  schemas:
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          description: The user's email address
          example: user@example.com
          format: email
        password:
          type: string
          description: The user's password
          example: securePassword123
          minLength: 8
          maxLength: 20
        confirmPassword:
          type: string
          description: Confirm password
          example: securePassword123
          minLength: 8
          maxLength: 20
        phoneNumber:
          type: string
          description: The user's phone number
          example: "0987654321"
          minLength: 10
          maxLength: 11
        name:
          type: string
          description: The user's name
          example: John Doe
        avatar:
          type: string
          description: URL to user's avatar image
          example: https://example.com/avatars/johndoe.jpg
        code:
          type: string
          description: Verification code
          example: "123456"
          minLength: 6
          maxLength: 6
      required:
        - email
        - password
        - confirmPassword
        - phoneNumber
        - name
        - code
    RegisterResponseDto:
      type: object
      properties:
        id:
          type: string
          description: The user's ID
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
        email:
          type: string
          description: The user's email address
          example: user@example.com
          format: email
        name:
          type: string
          description: The user's name
          example: John Doe
        phoneNumber:
          type: string
          description: The user's phone number
          example: "0987654321"
        createdAt:
          format: date-time
          type: string
          description: The user's created date
          example: 2023-10-27T00:00:00.000Z
        status:
          type: string
          description: The user's status
          example: ACTIVE
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED
        avatar:
          type: string
          description: URL to user's avatar image
          example: https://example.com/avatars/johndoe.jpg
          nullable: true
        updatedAt:
          format: date-time
          type: string
          description: The user's updated date
          example: 2023-10-27T00:00:00.000Z
      required:
        - id
        - email
        - name
        - phoneNumber
        - createdAt
        - status
        - avatar
        - updatedAt
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: address.city
          description:
            Dotted path to the offending field. Nested DTO failures flatten
            into this path.
        code:
          type: string
          example: isNotEmpty
          description:
            The class-validator constraint name. Stable and never localized —
            branch on this, not on `message`.
        message:
          type: string
          example: city should not be empty
          description: Human-facing text for this one constraint.
      required:
        - field
        - code
        - message
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        error:
          type: string
          example: VALIDATION_FAILED
          enum:
            - VALIDATION_FAILED
            - INTERNAL_SERVER_ERROR
            - RATE_LIMIT_EXCEEDED
            - REFERENCE_INVALID
            - EMAIL_NOT_FOUND
            - EMAIL_ALREADY_REGISTERED
            - PASSWORD_INVALID
            - VERIFICATION_CODE_INVALID
            - VERIFICATION_CODE_EXPIRED
            - TOTP_CODE_INVALID
            - TOTP_OR_VERIFICATION_CODE_REQUIRED
            - TWO_FACTOR_ALREADY_ENABLED
            - TWO_FACTOR_NOT_ENABLED
            - ACCESS_TOKEN_EXPIRED
            - ACCESS_TOKEN_INVALID
            - ACCESS_TOKEN_REQUIRED
            - AUTHORIZATION_FAILED
            - PERMISSION_DENIED
            - USER_NOT_FOUND
            - CURRENT_PASSWORD_INCORRECT
            - USER_ADMIN_CREATE_FORBIDDEN
            - USER_SELF_UPDATE_FORBIDDEN
            - USER_UPDATE_FORBIDDEN
            - USER_ADMIN_PROMOTE_FORBIDDEN
            - USER_ADMIN_DELETE_FORBIDDEN
            - USER_SAME_ROLE_DELETE_FORBIDDEN
            - ROLE_NOT_FOUND
            - ROLE_ALREADY_EXISTS
            - ROLE_SYSTEM_IMMUTABLE
            - PERMISSION_NOT_FOUND
            - PERMISSIONS_INVALID
            - DEVICE_NOT_FOUND
            - DEVICE_ALREADY_EXISTS
            - REFRESH_TOKEN_NOT_FOUND
            - REFRESH_TOKEN_ALREADY_EXISTS
            - VERIFICATION_CODE_NOT_FOUND
            - VERIFICATION_CODE_ALREADY_EXISTS
            - BRAND_NOT_FOUND
            - BRAND_ALREADY_EXISTS
            - BRAND_TRANSLATION_NOT_FOUND
            - BRAND_TRANSLATION_ALREADY_EXISTS
            - CATEGORY_NOT_FOUND
            - CATEGORY_ALREADY_EXISTS
            - CATEGORY_TRANSLATION_NOT_FOUND
            - CATEGORY_TRANSLATION_ALREADY_EXISTS
            - CATEGORY_PARENT_SELF_REFERENCE
            - PRODUCT_NOT_FOUND
            - PRODUCT_ALREADY_EXISTS
            - PRODUCT_TRANSLATION_NOT_FOUND
            - PRODUCT_TRANSLATION_ALREADY_EXISTS
            - PRODUCT_FORBIDDEN
            - TRANSLATION_REFERENCE_INVALID
            - SKU_NOT_FOUND
            - LANGUAGE_NOT_FOUND
            - LANGUAGE_ALREADY_EXISTS
            - CART_ITEM_NOT_FOUND
            - CART_ITEM_INSUFFICIENT_STOCK
            - CART_UPDATE_CONFLICT
            - ORDER_NOT_FOUND
