            - ORDER_CANCEL_FORBIDDEN
            - ORDER_STATUS_CONFLICT
            - ORDER_STATUS_TRANSITION_INVALID
            - ORDER_CART_ITEM_NOT_FOUND
            - SKU_UNAVAILABLE
            - SKU_INSUFFICIENT_STOCK
            - REVIEW_NOT_FOUND
            - REVIEW_ALREADY_EXISTS
            - REVIEW_NOT_PURCHASED
            - FILE_REQUIRED
            - FILE_COUNT_EXCEEDED
            - FILE_COUNT_TOO_FEW
