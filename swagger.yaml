            - PRECONDITION_REQUIRED
            - TOO_MANY_REQUESTS
            - UNRECOVERABLE_ERROR
            - NOT_IMPLEMENTED
            - BAD_GATEWAY
            - SERVICE_UNAVAILABLE
            - GATEWAY_TIMEOUT
            - HTTP_VERSION_NOT_SUPPORTED
            - INSUFFICIENT_STORAGE
            - LOOP_DETECTED
            - REQUEST_FAILED
          description:
            Stable machine code. Safe to branch on; never localized. Published
            as an enum so generated clients get a union instead of a bare
            string.
        message:
          type: string
          example: Validation failed
          description: Always a string — never an array, never an object.
        details:
          description: Always present. Empty for failures that are not scoped to a field.
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        requestId:
          type: string
          example: 3f1b2c8e-0e4a-4a1e-9f0c-2b7d0a1c5e64
          description:
            Correlates this response with the access log line for the same
            request.
      required:
        - statusCode
        - error
        - message
        - details
