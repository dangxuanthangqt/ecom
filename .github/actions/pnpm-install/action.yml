name: "PNPM install"
description: "Setup pnpm cache and install dependencies"

runs:
  using: "composite"

  steps:
    # No checkout here on purpose. Every caller checks out first, and a second
    # checkout re-clones at the default fetch-depth of 1 — discarding a caller's
    # `fetch-depth: 0` history and breaking anything that needs a merge base.

    # Version comes from .nvmrc, not a literal. A hardcoded number here drifted
    # from the Dockerfile once already and only surfaced when a dependency's
    # engines.node range rejected the CI runner mid-install.
    - name: Install Node.js from .nvmrc
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # Likewise: no version here. pnpm/action-setup reads `packageManager` from
    # package.json, which corepack also honours locally and in the Docker build.
    - name: Install pnpm from package.json packageManager
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: Expose pnpm config through "$GITHUB_OUTPUT"
      id: pnpm-config
      shell: bash
      run: |
        echo "PNPM_STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-config.outputs.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
