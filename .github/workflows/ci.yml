name: CI

on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Setup Prisma client
        uses: ./.github/actions/prisma-setup

      - name: Lint
        shell: bash
        run: pnpm lint

  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Setup Prisma client
        uses: ./.github/actions/prisma-setup

      - name: Build
        shell: bash
        run: pnpm build

  # Runs the Jest unit suite. Prisma client generation is required because the
  # specs type-check against the generated model types under ts-jest.
  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Setup Prisma client
        uses: ./.github/actions/prisma-setup

      # --ci fails instead of writing new snapshots; the run is sequential-ish
      # on a 2-core runner, so cap workers to keep the suite from thrashing.
      - name: Unit tests
        shell: bash
        run: |
          pnpm test:cov -- --ci --maxWorkers=2 \
            --coverageReporters=text --coverageReporters=json-summary

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary=coverage/coverage-summary.json
          if [ ! -f "$summary" ]; then
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("### Coverage\n");
            console.log("| Metric | % | Covered |");
            console.log("| --- | --- | --- |");
            ["statements", "branches", "functions", "lines"].forEach((k) =>
              console.log(row(k)),
            );
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
